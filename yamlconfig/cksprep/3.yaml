apiVersion: v1
kind: Namespace
metadata:
  name: cksprep3
  labels: 
    env: dev
spec: {}
status: {}
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: hardened-pod
  name: hardened-pod
  namespace: cksprep3
spec:
  volumes: 
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}
  - name: run
    emptyDir: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
  - image: nginx:1.25
    name: hardened-pod
    resources: {}
    volumeMounts: 
    - name: tmp
      mountPath: /tmp
    - name: cache
      mountPath: /var/cache/nginx
    - name: run
      mountPath: /var/run
    securityContext: 
      capabilities:
        drop: ["ALL"]
      allowPrivilegeEscalation: false
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: seccomp-pod
  name: seccomp-pod
  namespace: cksprep3
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
  - image: nginx:1.25
    name: seccomp-pod
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
